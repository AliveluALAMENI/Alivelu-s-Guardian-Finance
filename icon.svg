<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0080" />
      <stop offset="50%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#00e676" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ff0080" stop-opacity="0" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  <rect width="508" height="508" x="2" y="2" rx="106" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4" />

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="160" fill="url(#glowGrad)" filter="url(#neonGlow)" />

  <!-- Outer Shield Crest -->
  <path d="M 256 64 
           C 350 110, 420 110, 420 220 
           C 420 330, 340 410, 256 448 
           C 172 410, 92 330, 92 220 
           C 92 110, 162 110, 256 64 Z" 
        fill="none" 
        stroke="url(#shieldGrad)" 
        stroke-width="18" 
        stroke-linejoin="round"
        filter="url(#neonGlow)" />

  <!-- Inner High-Tech Shield Geometry -->
  <path d="M 256 100 
           C 328 138, 386 138, 386 226 
           C 386 312, 322 378, 256 410 
           C 190 378, 126 312, 126 226 
           C 126 138, 184 138, 256 100 Z" 
        fill="#0a0f24" 
        fill-opacity="0.85" 
        stroke="rgba(0, 229, 255, 0.4)" 
        stroke-width="4" />

  <!-- Financial Node Circuits & AI Nexus -->
  <g stroke="#00e5ff" stroke-width="3" opacity="0.75">
    <line x1="256" y1="160" x2="256" y2="210" />
    <line x1="256" y1="210" x2="200" y2="250" />
    <line x1="256" y1="210" x2="312" y2="250" />
    <line x1="200" y1="250" x2="200" y2="300" />
    <line x1="312" y1="250" x2="312" y2="300" />
    <line x1="200" y1="300" x2="256" y2="340" />
    <line x1="312" y1="300" x2="256" y2="340" />
  </g>

  <!-- Central Biometric Core / AI Nexus Diamond -->
  <polygon points="256,180 296,240 256,300 216,240" fill="url(#shieldGrad)" />
  <circle cx="256" cy="240" r="14" fill="#ffffff" />
  
  <!-- Circuit Nodes -->
  <circle cx="200" cy="250" r="7" fill="#00e676" />
  <circle cx="312" cy="250" r="7" fill="#ff0080" />
  <circle cx="200" cy="300" r="6" fill="#00e5ff" />
  <circle cx="312" cy="300" r="6" fill="#00e5ff" />
  <circle cx="256" cy="340" r="8" fill="#00e676" />

  <!-- GuardianFi Monogram Badge -->
  <text x="256" y="385" font-family="'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">GUARDIAN</text>
</svg>
